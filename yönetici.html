<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öz Murat Market - Yönetici Paneli</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans">

    <!-- ÜST BİLGİ VE NAVİGASYON -->
    <header class="bg-amber-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-store text-2xl"></i>
                <h1 class="font-bold text-lg md:text-xl">Öz Murat Market - Yönetim Paneli</h1>
            </div>
            <div id="authStatus" class="text-xs md:text-sm font-semibold bg-amber-700 px-3 py-1.5 rounded-lg">
                Giriş Kontrol Ediliyor...
            </div>
        </div>
    </header>

    <!-- ANA İÇERİK KONTEYNERİ -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- GİRİŞ FORMU (Oturum Açık Değilse Görünür) -->
        <section id="loginSection" class="hidden max-w-md mx-auto bg-white p-6 rounded-2xl shadow-lg border border-gray-100 mt-10">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Yönetici Girişi</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">E-Posta</label>
                    <input type="email" id="loginEmail" class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500" placeholder="admin@ozmuratmarket.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Şifre</label>
                    <input type="password" id="loginPassword" class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500" placeholder="••••••••">
                </div>
                <button onclick="login()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg transition text-sm">
                    Giriş Yap
                </button>
            </div>
        </section>

        <!-- YÖNETİM PANELİ İÇERİĞİ (Oturum Açıkken Görünür) -->
        <div id="adminContent" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- SOL KOLON: ÜRÜN EKLE / DÜZENLE FORMU (EL TERMINALI UYUMLU) -->
            <section class="lg:col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <h2 id="formTitle" class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2 border-b pb-2">
                    <i class="fa-solid fa-plus-circle text-amber-600"></i> Ürün Ekle / Güncelle
                </h2>

                <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4">
                    
                    <!-- EL TERMINALI BARKOD ALANI -->
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-200">
                        <label class="block text-xs font-bold text-amber-800 mb-1 flex items-center justify-between">
                            <span><i class="fa-solid fa-barcode"></i> Barkod (El Terminali)</span>
                            <span class="text-[10px] bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded font-normal">Okutun & Enter</span>
                        </label>
                        <input type="text" id="pBarcode" 
                               onkeydown="if(event.key === 'Enter') { event.preventDefault(); handleTerminalScan(); }" 
                               placeholder="Barkod okutun..." 
                               autofocus 
                               class="w-full border-2 border-amber-400 p-2.5 rounded-lg text-base font-bold font-mono focus:outline-none focus:border-amber-600 bg-white">
                    </div>

                    <!-- ÜRÜN ADI -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Ürün Adı *</label>
                        <input type="text" id="pName" required class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500">
                    </div>

                    <!-- KATEGORİ SEÇİMLERİ -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Ana Kategori *</label>
                            <select id="pMainCategory" onchange="updateSubCategories()" required class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500 bg-white">
                                <option value="">Seçiniz</option>
                                <option value="Meyve ve Sebze">Meyve ve Sebze</option>
                                <option value="Temel Gıda">Temel Gıda</option>
                                <option value="Atıştırmalık ve Tatlı">Atıştırmalık ve Tatlı</option>
                                <option value="İçecekler">İçecekler</option>
                                <option value="Süt ve Süt Ürünleri">Süt ve Süt Ürünleri</option>
                                <option value="Kahvaltılık">Kahvaltılık</option>
                                <option value="Fırın ve Pastane">Fırın ve Pastane</option>
                                <option value="Dondurulmuş Gıda">Dondurulmuş Gıda</option>
                                <option value="Temizlik ve Ev Bakımı">Temizlik ve Ev Bakımı</option>
                                <option value="Kişisel Bakım ve Hijyen">Kişisel Bakım ve Hijyen</option>
                                <option value="Bebek Dünyası">Bebek Dünyası</option>
                                <option value="Evcil Dostlar">Evcil Dostlar</option>
                                <option value="Züccaciye ve Ev Yaşam">Züccaciye ve Ev Yaşam</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Alt Kategori</label>
                            <select id="pSubCategory" class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500 bg-white">
                                <option value="">Önce Ana Kategori Seçin</option>
                            </select>
                        </div>
                    </div>

                    <!-- FİYAT VE İNDİRİMLİ FİYAT -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Satış Fiyatı (₺) *</label>
                            <input type="number" step="0.01" id="pPrice" required class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">İndirimli Fiyat (₺)</label>
                            <input type="number" step="0.01" id="pDiscountPrice" class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500" placeholder="Opsiyonel">
                        </div>
                    </div>

                    <!-- STOK VE BİRİM -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Stok Miktarı *</label>
                            <input type="number" id="pStock" value="10" required class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Birim *</label>
                            <select id="pUnit" required class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500 bg-white">
                                <option value="Adet">Adet</option>
                                <option value="Kg">Kg</option>
                                <option value="Gram">Gram</option>
                                <option value="Litre">Litre</option>
                                <option value="Paket">Paket</option>
                                <option value="Kutu">Kutu</option>
                            </select>
                        </div>
                    </div>

                    <!-- RESİM URL -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Görsel URL</label>
                        <input type="url" id="pImg" class="w-full border p-2.5 rounded-lg text-sm focus:outline-amber-500" placeholder="https://...">
                    </div>

                    <!-- BUTONLAR -->
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
                            <i class="fa-solid fa-floppy-disk"></i> Kaydet
                        </button>
                        <button type="button" onclick="resetForm()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2.5 rounded-lg text-sm transition">
                            Sıfırla
                        </button>
                    </div>
                </form>
            </section>

            <!-- SAĞ KOLON: ÜRÜN LİSTESİ VE ARAMA -->
            <section class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col h-full">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-4 border-b pb-3">
                    <h2 class="text-base font-bold text-gray-800">
                        <i class="fa-solid fa-list text-amber-600"></i> Ürün Listesi
                    </h2>
                    <div class="w-full sm:w-auto flex items-center gap-2">
                        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Ürün adı veya barkod ara..." class="border p-2 rounded-lg text-xs w-full sm:w-64 focus:outline-amber-500">
                    </div>
                </div>

                <!-- LİSTE TABLOSU -->
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left text-xs text-gray-600">
                        <thead class="bg-gray-50 text-gray-700 uppercase font-semibold border-b">
                            <tr>
                                <th class="p-2.5">Görsel</th>
                                <th class="p-2.5">Barkod</th>
                                <th class="p-2.5">Ürün Adı</th>
                                <th class="p-2.5">Kategori</th>
                                <th class="p-2.5">Fiyat</th>
                                <th class="p-2.5">Stok</th>
                                <th class="p-2.5 text-right">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody" class="divide-y divide-gray-100">
                            <!-- JavaScript ile dinamik dolacak -->
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

    <!-- SUPABASE VE UYGULAMA SCRIPT KODLARI -->
    <script>
        // SUPABASE BAĞLANTISI (Sizin Proje Bilgileriniz)
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];
        let editingProductId = null;

        // KATEGORİ MAPLEME
        const subCategoryData = {
            "Meyve ve Sebze": ["Meyve", "Sebze", "Yeşillik"],
            "Temel Gıda": ["Sıvı Yağlar", "Bakliyat", "Un, Şeker, Tuz", "Salça ve Konserve", "Makarna ve Şehriye", "Baharat ve Harçlar"],
            "Atıştırmalık ve Tatlı": ["Bisküvi, Çikolata, Gofret", "Cips ve Kuruyemiş", "Kek ve Gofret"],
            "İçecekler": ["Su ve Maden Suyu", "Çay, Kahve", "Gazlı İçecekler", "Meyve Suyu"],
            "Süt ve Süt Ürünleri": ["Süt", "Peynir", "Yoğurt", "Tereyağı ve Margarin"],
            "Kahvaltılık": ["Zeytin", "Reçel, Bal, Helva", "Şarküteri"],
            "Temizlik ve Ev Bakımı": ["Deterjan", "Bulaşık Yıkama", "Yüzey Temizleyiciler"],
            "Kişisel Bakım ve Hijyen": ["Şampuan ve Saç Bakımı", "Sabun ve Duş Jeli", "Ağız Bakımı"],
            "Züccaciye ve Ev Yaşam": ["Mutfak Gereçleri", "Plastik Ürünler"]
        };

        // SAYFA YÜKLENDİĞİNDE OTURUM VE LİSTE KONTROLÜ
        window.addEventListener("DOMContentLoaded", async () => {
            checkAuth();
            
            // İmleci doğrudan El Terminali Barkod Okuma Kutusuna Odakla
            const barcodeBox = document.getElementById("pBarcode");
            if(barcodeBox) barcodeBox.focus();
        });

        // OTURUM KONTROLÜ
        async function checkAuth() {
            const { data: { session } } = await db.auth.getSession();
            const authStatus = document.getElementById("authStatus");
            const loginSection = document.getElementById("loginSection");
            const adminContent = document.getElementById("adminContent");

            if (session) {
                authStatus.innerHTML = `<span class="flex items-center gap-2"><i class="fa-solid fa-circle-check text-green-400"></i> ${session.user.email} <button onclick="logout()" class="underline ml-2 text-xs">Çıkış</button></span>`;
                loginSection.classList.add("hidden");
                adminContent.classList.remove("hidden");
                fetchProducts();
            } else {
                authStatus.innerHTML = `Giriş Yapılmadı`;
                loginSection.classList.remove("hidden");
                adminContent.classList.add("hidden");
            }
        }

        // GİRİŞ YAPMA
        async function login() {
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) alert("Giriş Başarısız: " + error.message);
            else checkAuth();
        }

        // ÇIKIŞ YAPMA
        async function logout() {
            await db.auth.signOut();
            checkAuth();
        }

        // ALT KATEGORİLERİ GÜNCELLEME
        function updateSubCategories() {
            const mainCat = document.getElementById("pMainCategory").value;
            const subCatSelect = document.getElementById("pSubCategory");
            subCatSelect.innerHTML = '<option value="">Seçiniz</option>';

            if (subCategoryData[mainCat]) {
                subCategoryData[mainCat].forEach(sub => {
                    subCatSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
        }

        // ========================================================
        // BARSOFT EL TERMINALİ OTOMATİK TARAMA & GETİRME
        // ========================================================
        async function handleTerminalScan() {
            const barcodeInput = document.getElementById("pBarcode");
            const barcode = barcodeInput.value.trim();

            if (!barcode) return;

            // Supabase Veritabanında Ürünü Ara
            const { data: product, error } = await db
                .from('products')
                .select('*')
                .eq('barcode', barcode)
                .maybeSingle();

            if (error) {
                console.error("Hata:", error);
                alert("Ürün veritabanında aranırken bir hata oluştu!");
                return;
            }

            if (product) {
                // ÜRÜN BULUNDU: Form Alanlarını Otomatik Doldur
                editingProductId = product.id;
                document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-600"></i> Ürün Güncelle (#${product.id})`;
                
                document.getElementById("pName").value = product.name || '';
                document.getElementById("pMainCategory").value = product.main_category || '';
                updateSubCategories();
                document.getElementById("pSubCategory").value = product.sub_category || '';
                document.getElementById("pPrice").value = product.price || 0;
                document.getElementById("pDiscountPrice").value = product.discount_price || '';
                document.getElementById("pStock").value = product.stock || 0;
                document.getElementById("pUnit").value = product.unit || 'Adet';
                document.getElementById("pImg").value = product.image_url || '';

                // Hızlı düzenleme için imleci doğrudan Fiyat kutusuna odakla ve metni seç
                const priceInput = document.getElementById("pPrice");
                priceInput.focus();
                priceInput.select();

            } else {
                // ÜRÜN SİSTEMDE YOK: Yeni Ürün Moduna Geç
                editingProductId = null;
                document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-plus-circle text-amber-600"></i> Yeni Ürün Ekle`;
                
                document.getElementById("pName").value = '';
                document.getElementById("pPrice").value = '';
                document.getElementById("pDiscountPrice").value = '';
                document.getElementById("pStock").value = '10';
                document.getElementById("pImg").value = '';

                alert("⚠️ Bu barkoda ait ürün bulunamadı. Lütfen Ürün Adı ve Fiyatını girip kaydediniz.");
                document.getElementById("pName").focus();
            }
        }

        // ÜRÜNLERİ SUPABASE'DEN ÇEKME
        async function fetchProducts() {
            const { data, error } = await db.from('products').select('*').order('id', { ascending: false });
            if (error) {
                console.error("Hata:", error);
                return;
            }
            allProducts = data || [];
            renderProductTable(allProducts);
        }

        // ÜRÜNLERİ TABLOYA YAZDIRMA
        function renderProductTable(products) {
            const tbody = document.getElementById("productTableBody");
            tbody.innerHTML = "";

            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-gray-400">Ürün bulunamadı.</td></tr>`;
                return;
            }

            products.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="p-2.5">
                            <img src="${p.image_url || 'https://via.placeholder.com/40'}" class="w-8 h-8 object-cover rounded border">
                        </td>
                        <td class="p-2.5 font-mono text-gray-500 font-bold">${p.barcode || '-'}</td>
                        <td class="p-2.5 font-semibold text-gray-800">${p.name}</td>
                        <td class="p-2.5 text-xs text-gray-500">${p.main_category || '-'}</td>
                        <td class="p-2.5 font-bold text-amber-700">${p.price} ₺</td>
                        <td class="p-2.5 font-semibold">${p.stock} ${p.unit || 'Adet'}</td>
                        <td class="p-2.5 text-right space-x-1">
                            <button onclick="editProduct(${p.id})" class="text-blue-600 hover:text-blue-800 p-1"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteProduct(${p.id})" class="text-red-600 hover:text-red-800 p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // ARAMA VE FİLTRELEME
        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.name && p.name.toLowerCase().includes(query)) || 
                (p.barcode && p.barcode.toLowerCase().includes(query))
            );
            renderProductTable(filtered);
        }

        // ÜRÜN KAYDET / GÜNCELLE
        async function saveProduct(e) {
            e.preventDefault();

            const productData = {
                barcode: document.getElementById("pBarcode").value.trim() || null,
                name: document.getElementById("pName").value.trim(),
                main_category: document.getElementById("pMainCategory").value,
                sub_category: document.getElementById("pSubCategory").value || null,
                price: parseFloat(document.getElementById("pPrice").value),
                discount_price: document.getElementById("pDiscountPrice").value ? parseFloat(document.getElementById("pDiscountPrice").value) : null,
                stock: parseInt(document.getElementById("pStock").value),
                unit: document.getElementById("pUnit").value,
                image_url: document.getElementById("pImg").value.trim() || null
            };

            let response;
            if (editingProductId) {
                // Güncelleme
                response = await db.from('products').update(productData).eq('id', editingProductId);
            } else {
                // Yeni Ekleme
                response = await db.from('products').insert([productData]);
            }

            if (response.error) {
                alert("Kaydetme sırasında hata oluştu: " + response.error.message);
            } else {
                alert(editingProductId ? "Ürün başarıyla güncellendi!" : "Yeni ürün başarıyla eklendi!");
                resetForm();
                fetchProducts();
            }
        }

        // DÜZENLEME MODUNA GEÇ
        function editProduct(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            editingProductId = product.id;
            document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-600"></i> Ürün Güncelle (#${product.id})`;

            document.getElementById("pBarcode").value = product.barcode || '';
            document.getElementById("pName").value = product.name || '';
            document.getElementById("pMainCategory").value = product.main_category || '';
            updateSubCategories();
            document.getElementById("pSubCategory").value = product.sub_category || '';
            document.getElementById("pPrice").value = product.price || 0;
            document.getElementById("pDiscountPrice").value = product.discount_price || '';
            document.getElementById("pStock").value = product.stock || 0;
            document.getElementById("pUnit").value = product.unit || 'Adet';
            document.getElementById("pImg").value = product.image_url || '';
        }

        // ÜRÜN SİL
        async function deleteProduct(id) {
            if (!confirm("Bu ürünü silmek istediğinize emin misiniz?")) return;

            const { error } = await db.from('products').delete().eq('id', id);
            if (error) alert("Silme hatası: " + error.message);
            else fetchProducts();
        }

        // FORMU SIFIRLA
        function resetForm() {
            editingProductId = null;
            document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-plus-circle text-amber-600"></i> Ürün Ekle / Güncelle`;
            document.getElementById("productForm").reset();
            
            // Odaklanmayı tekrar Barkod kutusuna ver
            const barcodeBox = document.getElementById("pBarcode");
            if(barcodeBox) barcodeBox.focus();
        }
    </script>
</body>
</html>
