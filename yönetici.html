<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öz Murat Market - Yönetici Paneli</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <style>
        @media print {
            body * { visibility: hidden; }
            #receiptPrintArea, #receiptPrintArea * { visibility: visible; }
            #receiptPrintArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- HEADER -->
    <header class="bg-slate-800 text-white shadow">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-user-shield text-yellow-400"></i> Yönetim Paneli
            </h1>
            <a href="index.html" target="_blank" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">
                <i class="fa-solid fa-store"></i> Siteyi Gör
            </a>
        </div>
    </header>

    <div class="container mx-auto px-4 py-6">
        
        <!-- SEKMELER -->
        <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
            <button id="btnTabOrders" onclick="switchTab('orders')" class="flex-1 py-3 font-bold text-center border-b-2 border-slate-800 text-slate-800 transition">
                <i class="fa-solid fa-list-check me-2"></i> Siparişler
            </button>
            <button id="btnTabProducts" onclick="switchTab('products')" class="flex-1 py-3 font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-slate-800 transition">
                <i class="fa-solid fa-box-open me-2"></i> Ürün Yönetimi
            </button>
        </div>

        <!-- 1. SİPARİŞLER SEKMESİ -->
        <div id="sectionOrders">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">Gelen Siparişler</h2>
                <button onclick="loadOrders()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-3 py-2 rounded transition flex items-center gap-1">
                    <i class="fa-solid fa-rotate"></i> Yenile
                </button>
            </div>

            <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Sipariş kartları dinamik yüklenecek -->
            </div>
        </div>

        <!-- 2. ÜRÜN YÖNETİMİ SEKMESİ -->
        <div id="sectionProducts" class="hidden space-y-6">
            
            <!-- Ürün Ekle / Düzenle Formu -->
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h3 id="formTitle" class="font-bold text-gray-800 mb-4 text-base">Yeni Ürün Ekle</h3>
                <form id="productForm" onsubmit="handleProductSubmit(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="hidden" id="editProductId">
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Ürün Adı *</label>
                        <input type="text" id="pName" required placeholder="Örn: Süt 1L" class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Fiyat (TL) *</label>
                        <input type="number" step="0.01" id="pPrice" required placeholder="35.50" class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Birim</label>
                        <input type="text" id="pUnit" placeholder="Adet, Kg, Paket vb." class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Kategori</label>
                        <input type="text" id="pCategory" placeholder="Temel Gıda, Süt Ürünleri vb." class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-slate-800">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-600 mb-1">Görsel URL</label>
                        <input type="url" id="pImage" placeholder="https://..." class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-slate-800">
                    </div>

                    <div class="md:col-span-3 flex gap-2 pt-2">
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2 rounded text-sm transition">Kaydet</button>
                        <button type="button" onclick="resetProductForm()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold px-4 py-2 rounded text-sm transition">Temizle</button>
                    </div>
                </form>
            </div>

            <!-- Ürün Listesi Tablosu -->
            <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-700 uppercase text-xs border-b">
                        <tr>
                            <th class="p-3">Görsel</th>
                            <th class="p-3">Ürün Adı</th>
                            <th class="p-3">Kategori</th>
                            <th class="p-3">Fiyat</th>
                            <th class="p-3">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- Ürünler buraya yüklenecek -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- FİŞ YAZDIRMA MODALI -->
    <div id="receiptModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-4 relative shadow-2xl">
            <button onclick="closeReceiptModal()" class="absolute top-2 right-2 text-gray-500 hover:text-black">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div id="receiptPrintArea" class="p-2 font-mono text-xs text-black leading-tight">
                <!-- Fiş İçeriği Dinamik Gelecek -->
            </div>

            <div class="mt-4 flex gap-2">
                <button onclick="window.print()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded text-xs transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-print"></i> Fişi Yazdır
                </button>
            </div>
        </div>
    </div>

    <!-- SUPABASE VE YÖNETİM MANTIĞI -->
    <script>
        const SUPABASE_URL = "https://aenngsnsttnddndpftaw.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlbm5nc25zdHRuZGRuZHBmdGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzODU1NzEsImV4cCI6MjA1NTk2MTU3MX0.0R01e52uW2R2G9S2w4k1A6i3WvR1_S6T6c0wL1vXy_M";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let fetchedOrders = [];
        let fetchedProducts = [];

        function showToast(message, type = "info") {
            let bg = "#319795";
            if (type === "success") bg = "#38a169";
            if (type === "error") bg = "#e53e3e";

            Toastify({
                text: message,
                duration: 3000,
                close: true,
                gravity: "top",
                position: "right",
                style: { background: bg, borderRadius: "8px", fontWait: "bold" }
            }).showToast();
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadOrders();
            loadAdminProducts();
        });

        function switchTab(tab) {
            if(tab === 'orders') {
                document.getElementById("sectionOrders").classList.remove("hidden");
                document.getElementById("sectionProducts").classList.add("hidden");
                document.getElementById("btnTabOrders").className = "flex-1 py-3 font-bold text-center border-b-2 border-slate-800 text-slate-800 transition";
                document.getElementById("btnTabProducts").className = "flex-1 py-3 font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-slate-800 transition";
            } else {
                document.getElementById("sectionOrders").classList.add("hidden");
                document.getElementById("sectionProducts").classList.remove("hidden");
                document.getElementById("btnTabProducts").className = "flex-1 py-3 font-bold text-center border-b-2 border-slate-800 text-slate-800 transition";
                document.getElementById("btnTabOrders").className = "flex-1 py-3 font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-slate-800 transition";
            }
        }

        // 1. SİPARİŞ İŞLEMLERİ
        async function loadOrders() {
            const container = document.getElementById("ordersContainer");
            container.innerHTML = `<div class="col-span-full text-center py-6 text-gray-500">Siparişler yükleniyor...</div>`;

            const { data, error } = await db.from('orders').select('*').order('created_at', { ascending: false });
            if(error) return showToast("Hata: " + error.message, "error");

            fetchedOrders = data || [];
            if(fetchedOrders.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-6 text-gray-500">Henüz sipariş yok.</div>`;
                return;
            }

            container.innerHTML = fetchedOrders.map(o => {
                const subtotal = (o.items || []).reduce((sum, i) => sum + (i.price * i.qty), 0);
                const shippingFee = subtotal >= 1500 ? 0 : 100;

                return `
                <div class="bg-white p-4 rounded-xl shadow-sm border space-y-3 relative">
                    <div class="flex justify-between items-start border-b pb-2">
                        <div>
                            <span class="font-bold text-sm text-gray-800">Sipariş #${o.id}</span>
                            <div class="text-[11px] text-gray-400">${new Date(o.created_at).toLocaleString('tr-TR')}</div>
                        </div>
                        <span class="text-xs px-2 py-1 rounded font-bold ${o.status === 'Tamamlandı' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-800'}">${o.status || 'Hazırlanıyor'}</span>
                    </div>

                    <div class="text-xs space-y-1 text-gray-600">
                        <div><strong>Müşteri:</strong> ${o.customer_name}</div>
                        <div><strong>Tel:</strong> ${o.customer_phone}</div>
                        <div><strong>Adres:</strong> ${o.customer_address}</div>
                        ${o.order_note ? `<div class="text-red-600"><strong>Not:</strong> ${o.order_note}</div>` : ''}
                    </div>

                    <div class="border-t border-b py-2 space-y-1 text-xs">
                        ${(o.items || []).map(i => `
                            <div class="flex justify-between text-gray-700">
                                <span>${i.name} (${i.qty} ${i.unit})</span>
                                <span class="font-semibold">${(i.price * i.qty).toFixed(2)} TL</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="text-xs space-y-1">
                        <div class="flex justify-between text-gray-500"><span>Ara Toplam:</span><span>${subtotal.toFixed(2)} TL</span></div>
                        <div class="flex justify-between text-gray-500"><span>Kargo Ücreti:</span><span>${shippingFee > 0 ? shippingFee.toFixed(2) + ' TL' : 'Ücretsiz'}</span></div>
                        <div class="flex justify-between items-center text-sm font-bold text-green-700 pt-1 border-t">
                            <span>Toplam Tutar:</span>
                            <span>${o.total_amount} TL</span>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button onclick="updateOrderStatus(${o.id}, '${o.status === 'Tamamlandı' ? 'Hazırlanıyor' : 'Tamamlandı'}')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold py-1.5 rounded transition">
                            ${o.status === 'Tamamlandı' ? 'Hazırlanıyor Yap' : 'Tamamlandı İşaretle'}
                        </button>
                        <button onclick="openReceiptModal(${o.id})" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded transition">
                            <i class="fa-solid fa-print"></i> Fiş
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        async function updateOrderStatus(orderId, newStatus) {
            const { error } = await db.from('orders').update({ status: newStatus }).eq('id', orderId);
            if(error) return showToast("Güncellenemedi!", "error");
            showToast("Sipariş durumu güncellendi.", "success");
            loadOrders();
        }

        // Fiş Açma
        function openReceiptModal(orderId) {
            const order = fetchedOrders.find(o => o.id === orderId);
            if(!order) return;
            const printArea = document.getElementById("receiptPrintArea");
            const dateStr = new Date(order.created_at).toLocaleString('tr-TR');

            const subtotal = (order.items || []).reduce((sum, i) => sum + (i.price * i.qty), 0);
            const shippingFee = subtotal >= 1500 ? 0 : 100;

            let itemsHtml = (order.items || []).map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom: 3px;"><span>${i.name}</span></div>
                <div style="display:flex; justify-content:space-between; margin-bottom: 5px; color: #444;"><span>&nbsp;&nbsp;${i.qty} ${i.unit} x ${i.price} TL</span><span style="font-weight:bold;">${(i.price * i.qty).toFixed(2)} TL</span></div>
            `).join('');

            printArea.innerHTML = `
                <div style="text-align:center; border-bottom: 1px dashed #000; padding-bottom: 8px; margin-bottom: 8px;">
                    <h2 style="font-size: 16px; font-weight: bold;">ÖZ MURAT MARKET</h2>
                    <p style="font-size: 10px;">Samsun İlkadım Kışla Mah.</p>
                    <p style="font-size: 10px;">Tel: (0362) 236 36 10</p>
                    <p style="font-size: 11px; font-weight: bold; margin-top: 5px;">SİPARİŞ FİŞİ #${order.id}</p>
                </div>
                <div style="border-bottom: 1px dashed #000; padding-bottom: 6px; margin-bottom: 6px;">
                    <div><strong>Müşteri:</strong> ${order.customer_name}</div>
                    <div><strong>Tel:</strong> ${order.customer_phone}</div>
                    <div><strong>Tarih:</strong> ${dateStr}</div>
                    <div><strong>Adres:</strong> ${order.customer_address}</div>
                </div>
                ${order.order_note ? `<div style="border-bottom: 1px dashed #000; padding-bottom: 6px; margin-bottom: 6px;"><strong>NOT:</strong> ${order.order_note}</div>` : ''}
                <div style="border-bottom: 1px dashed #000; padding-bottom: 6px; margin-bottom: 6px;">${itemsHtml}</div>
                
                <div style="border-bottom: 1px dashed #000; padding-bottom: 4px; margin-bottom: 4px; font-size: 11px;">
                    <div style="display:flex; justify-content:space-between;"><span>Ara Toplam:</span><span>${subtotal.toFixed(2)} TL</span></div>
                    <div style="display:flex; justify-content:space-between;"><span>Kargo Ücreti:</span><span>${shippingFee > 0 ? shippingFee.toFixed(2) + ' TL' : 'ÜCRETSİZ'}</span></div>
                </div>

                <div style="display:flex; justify-content:space-between; font-size: 14px; font-weight: bold;"><span>GENEL TOPLAM:</span><span>${order.total_amount} TL</span></div>
            `;
            document.getElementById("receiptModal").classList.remove("hidden");
        }

        function closeReceiptModal() {
            document.getElementById("receiptModal").classList.add("hidden");
        }

        // 2. ÜRÜN YÖNETİM İŞLEMLERİ
        async function loadAdminProducts() {
            const tbody = document.getElementById("productsTableBody");
            const { data, error } = await db.from('products').select('*').order('name', { ascending: true });
            if(error) return;

            fetchedProducts = data || [];
            tbody.innerHTML = fetchedProducts.map(p => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3"><img src="${p.image_url || 'https://via.placeholder.com/50'}" class="w-10 h-10 object-contain rounded border"></td>
                    <td class="p-3 font-semibold text-gray-800">${p.name}</td>
                    <td class="p-3">${p.category || '-'}</td>
                    <td class="p-3 font-bold">${p.price} TL / ${p.unit || 'Adet'}</td>
                    <td class="p-3">
                        <button onclick="editProduct(${p.id})" class="text-blue-600 hover:underline me-2 font-bold">Düzenle</button>
                        <button onclick="deleteProduct(${p.id})" class="text-red-600 hover:underline font-bold">Sil</button>
                    </td>
                </tr>
            `).join('');
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("editProductId").value;
            const name = document.getElementById("pName").value.trim();
            const price = parseFloat(document.getElementById("pPrice").value);
            const unit = document.getElementById("pUnit").value.trim() || 'Adet';
            const category = document.getElementById("pCategory").value.trim();
            const image_url = document.getElementById("pImage").value.trim();

            const payload = { name, price, unit, category, image_url };

            if(id) {
                const { error } = await db.from('products').update(payload).eq('id', id);
                if(error) return showToast("Hata: " + error.message, "error");
                showToast("Ürün güncellendi.", "success");
            } else {
                const { error } = await db.from('products').insert([payload]);
                if(error) return showToast("Hata: " + error.message, "error");
                showToast("Yeni ürün eklendi.", "success");
            }

            resetProductForm();
            loadAdminProducts();
        }

        function editProduct(id) {
            const p = fetchedProducts.find(item => item.id === id);
            if(!p) return;

            document.getElementById("editProductId").value = p.id;
            document.getElementById("pName").value = p.name;
            document.getElementById("pPrice").value = p.price;
            document.getElementById("pUnit").value = p.unit || '';
            document.getElementById("pCategory").value = p.category || '';
            document.getElementById("pImage").value = p.image_url || '';

            document.getElementById("formTitle").innerText = "Ürünü Düzenle";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProduct(id) {
            if(!confirm("Bu ürünü silmek istediğinize emin misiniz?")) return;
            const { error } = await db.from('products').delete().eq('id', id);
            if(error) return showToast("Silinemedi!", "error");
            showToast("Ürün silindi.", "info");
            loadAdminProducts();
        }

        function resetProductForm() {
            document.getElementById("productForm").reset();
            document.getElementById("editProductId").value = "";
            document.getElementById("formTitle").innerText = "Yeni Ürün Ekle";
        }
    </script>
</body>
</html>
